<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>钢铁誓约：重装肉鸽坦克 | Battle City: Rogue Bastion</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <!-- Military & Sci-Fi Industrial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        background-color: #02050c;
        background-image: 
          radial-gradient(circle at 50% 30%, rgba(14, 30, 58, 0.4) 0%, transparent 70%),
          linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
        background-size: 100% 100%, 32px 32px, 32px 32px;
        color: #f8fafc;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Chakra Petch', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Heavy Armored Cockpit Enclosure */
      #cockpit-frame {
        position: relative;
        padding: 10px;
        background: linear-gradient(180deg, #243046 0%, #161f30 50%, #0a0f18 100%);
        border: 2px solid #38bdf8;
        box-shadow: 
          0 40px 100px -20px rgba(0, 0, 0, 0.98),
          0 0 50px rgba(2, 132, 199, 0.25),
          inset 0 1px 2px rgba(255, 255, 255, 0.2);
        border-radius: 8px;
      }

      /* Top Command Status Bar */
      #cockpit-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 14px 7px;
        background: linear-gradient(90deg, #090e18 0%, #111a2c 50%, #090e18 100%);
        border-bottom: 2px solid #1e293b;
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        color: #94a3b8;
        letter-spacing: 1.5px;
        margin-bottom: 4px;
        border-radius: 4px 4px 0 0;
      }
      .cockpit-led-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cockpit-led {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
        animation: ledBlink 2s infinite;
      }
      .cockpit-led.amber {
        background: #f59e0b;
        box-shadow: 0 0 10px #f59e0b;
        animation: ledBlink 2.4s infinite;
      }
      .cockpit-led.cyan {
        background: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
        animation: ledBlink 1.8s infinite;
      }
      @keyframes ledBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      #audio-toggle-btn {
        background: #1e293b;
        border: 1px solid #475569;
        color: #38bdf8;
        padding: 3px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        transition: all 0.2s;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }
      #audio-toggle-btn:hover {
        background: #334155;
        border-color: #38bdf8;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      }

      #game-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #060910;
        border-radius: 4px;
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
      }
      #game-canvas {
        display: block;
        cursor: crosshair;
      }

      /* CRT Scanlines & Phosphor Glare */
      #crt-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        background: 
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%),
          linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
        background-size: 100% 3px, 4px 100%;
        box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7);
      }
      #ui-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Mobile Controls Layer */
      #mobile-controls {
        display: none;
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        pointer-events: none;
        z-index: 20;
        padding: 0 20px;
        justify-content: space-between;
        align-items: flex-end;
      }
      @media (pointer: coarse), (max-width: 800px) {
        #mobile-controls {
          display: flex;
        }
      }
      .touch-dpad {
        pointer-events: auto;
        display: grid;
        grid-template-columns: repeat(3, 50px);
        grid-template-rows: repeat(3, 50px);
        gap: 6px;
      }
      .touch-btn {
        background: rgba(30, 41, 59, 0.9);
        border: 2px solid #475569;
        clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0% 85%, 0% 15%);
        color: #f8fafc;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: none;
      }
      .touch-btn:active {
        background: rgba(56, 189, 248, 0.6);
        border-color: #38bdf8;
      }
      .touch-actions {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .touch-action-btn {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        border: 2px solid #38bdf8;
        clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        color: white;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      }
      .touch-action-btn:active {
        background: #0369a1;
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div id="cockpit-frame">
      <div id="cockpit-top-bar">
        <div class="cockpit-led-group">
          <span class="cockpit-led"></span>
          <span class="cockpit-led amber"></span>
          <span class="cockpit-led cyan"></span>
          <span style="color: #38bdf8; font-weight: 700; margin-left: 6px;">SYS_CONSOLE MK-IV</span>
          <span style="color: #64748b; margin-left: 8px;">// BASTION RADAR LINK ONLINE</span>
        </div>
        <button id="audio-toggle-btn">🔊 BGM: ON</button>
      </div>
      <div id="game-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="crt-overlay"></div>
        <div id="ui-overlay"></div>

        <!-- Touch Controls for Mobile Devices -->
        <div id="mobile-controls">
          <div class="touch-dpad">
            <div></div>
            <button class="touch-btn" id="m-up">▲</button>
            <div></div>
            <button class="touch-btn" id="m-left">◀</button>
            <div></div>
            <button class="touch-btn" id="m-right">▶</button>
            <div></div>
            <button class="touch-btn" id="m-down">▼</button>
            <div></div>
          </div>
          <div class="touch-actions">
            <button class="touch-action-btn" id="m-dash" style="width: 58px; height: 58px; background: #334155; border-color: #64748b;">冲刺</button>
            <button class="touch-action-btn" id="m-fire">开火</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script>
      // Setup Touch Buttons
      window.addEventListener('DOMContentLoaded', () => {
        const bindKey = (id, keyCode, code) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          const press = (e) => {
            e.preventDefault();
            window.dispatchEvent(new KeyboardEvent('keydown', { key: keyCode, code: code }));
          };
          const release = (e) => {
            e.preventDefault();
            window.dispatchEvent(new KeyboardEvent('keyup', { key: keyCode, code: code }));
          };
          btn.addEventListener('touchstart', press, { passive: false });
          btn.addEventListener('touchend', release, { passive: false });
          btn.addEventListener('mousedown', press);
          btn.addEventListener('mouseup', release);
        };
        bindKey('m-up', 'w', 'KeyW');
        bindKey('m-down', 's', 'KeyS');
        bindKey('m-left', 'a', 'KeyA');
        bindKey('m-right', 'd', 'KeyD');
        bindKey('m-fire', ' ', 'Space');
        bindKey('m-dash', 'Shift', 'ShiftLeft');
      });
    </script>
  </body>
</html>
